name: PDDGecko
options:
  bundleIdPrefix: com.pdd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # 固定工程格式为 Xcode 15 可读的版本，避免云端 Xcode 版本不一致导致
  # "Unable to read project" 错误。
  xcodeVersion: "15.4"
  objectVersion: 56

settings:
  base:
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""

targets:
  PDDGecko:
    type: application
    platform: iOS
    sources:
      - path: PDDGecko
        excludes:
          - "Resources/**"
      - path: PDDGecko/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdd.gecko.ios
        PRODUCT_NAME: PDDGecko
        INFOPLIST_FILE: PDDGecko/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
